name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      publish_to_store:
        description: 'Publish to Chrome Web Store'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      # Run tests first
      - run: npm run test:unit

      # Get current version from package.json
      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      # Build release version
      - run: npm run build:release

      # Generate changelog from commits
      - name: Generate changelog
        id: changelog
        run: |
          # Get commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            RAW_COMMITS=$(git log --pretty=format:"%s" --no-merges)
          else
            RAW_COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"%s" --no-merges)
          fi

          # Filter only feat/fix and make human-readable
          FEATURES=""
          FIXES=""

          while IFS= read -r line; do
            # Remove prefix and scope like feat(scope): or fix(scope):
            clean=$(echo "$line" | sed -E 's/^(feat|fix)(\([^)]+\))?:\s*//')
            # Capitalize first letter
            clean=$(echo "$clean" | sed 's/^./\U&/')

            if echo "$line" | grep -q "^feat"; then
              FEATURES="${FEATURES}- ${clean}\n"
            elif echo "$line" | grep -q "^fix"; then
              FIXES="${FIXES}- ${clean}\n"
            fi
          done <<< "$RAW_COMMITS"

          # Build final changelog with sections
          COMMITS=""
          if [ -n "$FEATURES" ]; then
            COMMITS="What's New:\n${FEATURES}\n"
          fi
          if [ -n "$FIXES" ]; then
            COMMITS="${COMMITS}Bug Fixes:\n${FIXES}"
          fi
          COMMITS=$(echo -e "$COMMITS" | sed '/^$/d')

          # Save to file for release notes
          echo -e "$COMMITS" > /tmp/changelog.txt

          # Format for output
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo -e "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Update CHANGELOG.md
      - name: Update CHANGELOG.md
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DATE=$(date +%Y-%m-%d)

          if [ -f docs/CHANGELOG.md ]; then
            # Create temp file with new entry
            {
              echo "# Changelog"
              echo ""
              echo "## [$VERSION] - $DATE"
              echo ""
              cat /tmp/changelog.txt
              echo ""
              # Append rest of changelog (skip first line "# Changelog")
              tail -n +2 docs/CHANGELOG.md
            } > /tmp/CHANGELOG.new.md

            mv /tmp/CHANGELOG.new.md docs/CHANGELOG.md
          fi

      # Create zip for Chrome Web Store
      - name: Package extension
        run: |
          cd dist && zip -r ../vocabulary-extension-v${{ steps.version.outputs.version }}.zip .

      # Commit changelog update
      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/CHANGELOG.md || true
          git diff --staged --quiet || git commit -m "docs: update changelog for v${{ steps.version.outputs.version }}"
          git push

      # Create git tag
      - name: Create tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

      # Create GitHub release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            ## Changes

            ${{ steps.changelog.outputs.changelog }}

            ## Installation

            Download `vocabulary-extension-v${{ steps.version.outputs.version }}.zip` and load as unpacked extension, or install from Chrome Web Store.
          files: |
            vocabulary-extension-v${{ steps.version.outputs.version }}.zip
          draft: false
          prerelease: false

      # Publish to Chrome Web Store (optional)
      - name: Get Chrome Web Store access token
        if: ${{ inputs.publish_to_store }}
        id: cws_token
        run: |
          TOKEN=$(curl -s -X POST "https://oauth2.googleapis.com/token" \
            -d "client_id=${{ secrets.CWS_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.CWS_CLIENT_SECRET }}" \
            -d "refresh_token=${{ secrets.CWS_REFRESH_TOKEN }}" \
            -d "grant_type=refresh_token" | jq -r '.access_token')
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Upload to Chrome Web Store
        if: ${{ inputs.publish_to_store }}
        run: |
          # Upload new version
          curl -s -X PUT \
            -H "Authorization: Bearer ${{ steps.cws_token.outputs.token }}" \
            -H "x-goog-api-version: 2" \
            -T "vocabulary-extension-v${{ steps.version.outputs.version }}.zip" \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/${{ secrets.EXTENSION_ID }}"

      - name: Update Chrome Web Store listing with changelog
        if: ${{ inputs.publish_to_store }}
        run: |
          # Prepare changelog for "What's New" section (limit to 10 items)
          WHATS_NEW=$(head -10 /tmp/changelog.txt | sed 's/"/\\"/g')

          # Update store listing with changelog
          curl -s -X PUT \
            -H "Authorization: Bearer ${{ steps.cws_token.outputs.token }}" \
            -H "x-goog-api-version: 2" \
            -H "Content-Type: application/json" \
            -d "{\"changesNotes\": \"v${{ steps.version.outputs.version }}:\n${WHATS_NEW}\"}" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/${{ secrets.EXTENSION_ID }}"

      - name: Publish to Chrome Web Store
        if: ${{ inputs.publish_to_store }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ steps.cws_token.outputs.token }}" \
            -H "x-goog-api-version: 2" \
            -H "Content-Length: 0" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/${{ secrets.EXTENSION_ID }}/publish"
